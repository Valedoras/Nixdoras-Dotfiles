config_version = 20

[bar]
order = [ "Valedoras" ]

    [bar.Valedoras]
    background_opacity = 0.84999998100101948
    border = "on_surface_variant"
    compositor_blur = false
    concave_edge_corners = false
    end = [ "clipboard", "volume", "brightness", "battery", "settings" ]
    font_family = "GoMono Nerd Font"
    font_weight = 600
    margin_edge = 9
    margin_ends = 490
    radius = 4
    shadow = false
    start = [ "session", "launcher", "wallpaper", "workspaces" ]
    thickness = 31
    widget_spacing = 9

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
icon_size = 32
position = "left"
radius = 4
reserve_space = false
show_dots = true
show_instance_count = false
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1067.0
    cy = 1018.0
    output = "Virtual-1"
    placement_height = 1200.0
    placement_width = 2133.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "GoMono Nerd Font"

    [shell.launcher]
    track_usage = false

        [shell.launcher.providers.calculator]
        global = false

    [shell.panel]
    control_center_position = "center"
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screen_corners]
    size = 24

[theme]
builtin = "Tokyo-Night"
community_palette = "Occult Umbral"
custom_palette = "Monochrome"
mode = "dark"
shell_mode = "dark"
source = "custom"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "foot", "gtk3", "gtk4", "kitty", "niri" ]

[wallpaper]
directory = "/home/nixdoras/home/pictures/wallpapers"
fill_color = "primary"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/nixdoras/home/pictures/wallpapers/ddd.png"

    [wallpaper.last]
    path = "/home/nixdoras/home/pictures/wallpapers/ddd.png"

    [wallpaper.monitors.Virtual-1]
    path = "/home/nixdoras/home/pictures/wallpapers/ddd.png"

[widget.settings]
custom_image_colorize = true
font_scale = 1.03

[widget.workspaces]
active_pill_size = 1.9000000000000001
pill_scale = 0.84999999999999998
show_labels = false