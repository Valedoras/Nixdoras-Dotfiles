config_version = 16

[bar]
order = [ "Valedoras" ]

    [bar.Valedoras]
    background_opacity = 0.79999998211860657
    concave_edge_corners = false
    end = [
        "media",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "settings"
    ]
    font_family = "JetBrainsMono NF ExtraBold"
    margin_edge = 9
    margin_ends = 400
    position = "bottom"
    radius = 4
    start = [ "session", "launcher", "wallpaper", "workspaces" ]
    thickness = 32
    widget_spacing = 9

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
icon_size = 32
position = "left"
radius = 4
reserve_space = false
show_dots = true
show_instance_count = false
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1067.0
    cy = 1018.0
    output = "Virtual-1"
    placement_height = 1200.0
    placement_width = 2133.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "JetBrainsMono NF ExtraBold"

    [shell.launcher]
    track_usage = false

        [shell.launcher.providers.calculator]
        global = false

    [shell.panel]
    control_center_position = "center"
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screen_corners]
    size = 24

[theme]
community_palette = "Oxocarbon"
mode = "dark"
shell_mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "ghostty", "niri" ]

[wallpaper]
directory = "/home/nixdoras/home/pictures"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/nixdoras/home/pictures/ElainaV1.jpg"

    [wallpaper.last]
    path = "/home/nixdoras/home/pictures/ElainaV1.jpg"

    [wallpaper.monitors.Virtual-1]
    path = "/home/nixdoras/home/pictures/ElainaV1.jpg"

[widget.settings]
custom_image = "/home/valedoras/Downloads/nixos (1).png"
custom_image_colorize = true